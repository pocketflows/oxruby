[package]
name = "oxtree"
description = "A Rust port of the syntax_tree Ruby formatter (and its ERB plugin), distributed as the `oxtree` gem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The oxc formatter crates need Rust 1.97.
rust-version = "1.97"

[[bin]]
name = "oxtree"
path = "src/main.rs"

[features]
default = ["oxc"]
# Link the oxc formatter crates (pinned to the commit that produced oxfmt
# 0.72.0) instead of always running the `oxfmt` executable.
oxc = [
  "dep:oxc_allocator",
  "dep:oxc_formatter",
  "dep:oxc_formatter_core",
  "dep:oxc_formatter_css",
  "dep:oxc_formatter_json",
  "dep:oxc_span",
]

[dependencies]
rayon = "1.10"
regex = "1"
ruby-prism = "=2.0.0-rc.2"
serde_json = "1"

# oxfmt 0.72.0 is tag oxfmt_v0.72.0 (2bd08eb) of the oxc repository; the
# formatter crates aren't published on crates.io. The workspace root patches
# `oxc_allocator` to the same tag, as oxc's own workspace does.
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
oxc_formatter_css = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
oxc_formatter_json = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.72.0", optional = true }
