[package]
name = "oxtree"
description = "A Rust port of the syntax_tree Ruby formatter (and its ERB plugin), distributed as the `oxtree` gem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxtree"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
regex = "1"
ruby-prism = "1.9"
