[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/theodoretliu/oxruby"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ruby-prism = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
